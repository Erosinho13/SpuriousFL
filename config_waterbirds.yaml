seed: 42
data_shuffle_seed : null
dirichlet_alpha: 0.5
dataset: WaterBirds
batch_size: 8
epochs: 1
rounds: 10
num_clients: 4
weight_clients: true
norm: true
aug_crop: 24
aug_horizontal_flip: true
split_mode: sameratio
client_opt:
    optimizer: SGD
    learning_rate: 0.0001
server_opt:
    optimizer: FedAvg
    learning_rate: 0.1
    beta_1: 0.9
    beta_2: 0.99
    tau: 0.000000001
wandb: true
model_type: CNN
dataset_options:
    input_size: 64
