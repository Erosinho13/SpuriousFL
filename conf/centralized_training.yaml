defaults:
  - job/centralized_training@_here_
  - _self_
  - machine: env
  - client_opt: all_defaults
  - server_opt: all_defaults
  - model_options: resnet
  - dataset_options: cifar10

seed: 42
client_opt:
  epochs: 200
rounds: 10
num_clients: 10
norm: true
aug_crop: 4
aug_horizontal_flip: true
split_mode: dirichlet
server_opt:
  optimizer: FedAvgM
wandb: false
model_options:
  pretrained: false
checkpoint: null
local_training_id: null
