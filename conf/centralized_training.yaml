defaults:
  - job/centralized_training@_here_
  - machine: env
  - client_opt: all_defaults
  - server_opt: all_defaults
  - model_options: resnet
  - dataset_options: cifar10
  - override hydra/launcher: kyiv
  - _self_

hydra:
  mode: MULTIRUN
  launcher:
    cpus_per_task: 4
    mem_gb: 24
    additional_parameters:
      gres: "shard:4"

seed: 42
client_opt:
  epochs: 200
server_opt:
  optimizer: FedAvgM
wandb: false
model_options:
  pretrained: false
checkpoint: null
