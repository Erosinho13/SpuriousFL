seed: 42
data_shuffle_seed : null
dirichlet_alpha: 0.5
batch_size: 8
epochs: 1
rounds: 10
num_clients: 4
norm: true
aug_crop: 24
aug_horizontal_flip: true
split_mode: homogen
client_opt:
    subpop_optimizer: GroupDRO
    base_optimizer: SGD
    learning_rate: 1e-3
    momentum: 0.9
    groupdro_eta: 0.01
    cbloss_beta: 0.9999
    focal_gamma: 1
    dfr_reg: 0.1
    fex_shallow_model: CNN
    fex_epochs: 5
    fex_balance_classes: true
server_opt:
    optimizer: FedAvg
    learning_rate: 0.1
    beta_1: 0.9
    beta_2: 0.99
    tau: 0.000000001
    weight_clients: same
wandb: true
model_options:
    model_type: ResNet
    norm_layer: gn
dataset_options:
    name: WaterBirds
    input_size: 64
    num_targets: 2
    num_groups: 2
checkpoint: null